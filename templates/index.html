<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panou Control - Hala Digital Twin</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        /* TEMA INCHISA (DARK MODE) */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 26px;
            margin-bottom: 30px;
        }

        /* CONTAINERUL PRINCIPAL (Reprezinta HALA) */
        #hala-structura {
            background-color: #161b22;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 900px;
            border: 2px solid #30363d;
            transition: box-shadow 0.6s ease, border-color 0.6s ease;
            position: relative;
        }

        /* EFECTELE DE GLOW EXTERIOR */
        .glow-rosu { box-shadow: 0 0 60px rgba(255, 77, 77, 0.4); border-color: #ff4d4d !important; }
        .glow-albastru { box-shadow: 0 0 60px rgba(77, 166, 255, 0.4); border-color: #4da6ff !important; }
        .glow-galben { box-shadow: 0 0 60px rgba(255, 204, 0, 0.3); border-color: #ffcc00 !important; }

        /* ECRANE EXTERIOARE (Sus) */
        .ecrane-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 40px;
        }

        .ecran-digital {
            background-color: #010409;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .ecran-titlu { font-size: 13px; color: #8b949e; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px;}
        .ecran-valoare { font-size: 22px; font-weight: bold; color: #ffffff; }

        /* ZONA CENTRALA CU CEASURI */
        .ceasuri-wrapper {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            background-color: #21262d;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #30363d;
        }

        /* INDICATOR STARE PERMANENT (NOU) */
        .banner-status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            transition: background-color 0.4s, border-color 0.4s;
        }
        
        .bg-verde { background-color: #2ea043; border-left: 6px solid #238636; }
        .bg-galben { background-color: #9e6a03; border-left: 6px solid #ffd700; animation: pulse 2s infinite; }
        .bg-rosu { background-color: #8a1515; border-left: 6px solid #ff4d4d; }
        .bg-mov { background-color: #551a8b; border-left: 6px solid #9933ff; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* ECRAN HARDWARE (Jos) */
        .hardware-panel {
            margin-top: 30px;
            background-color: #010409;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            color: #8b949e;
        }
        .hardware-panel span { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Panou Control Digital Twin</h1>

    <div id="hala-structura" class="glow-galben">
        
        <div class="ecrane-top">
            <div class="ecran-digital">
                <div class="ecran-titlu">Temperatura Tinta Setata</div>
                <div class="ecran-valoare"><span id="val-tinta">--</span> C</div>
            </div>
            <div class="ecran-digital">
                <div class="ecran-titlu">Status Actiune Curenta</div>
                <div class="ecran-valoare" id="stare-text">Conectare...</div>
            </div>
        </div>

        <div class="ceasuri-wrapper">
            <div id="gauge_temp" style="width: 200px; height: 200px;"></div>
            <div id="gauge_pres" style="width: 200px; height: 200px;"></div>
            <div id="gauge_vib" style="width: 200px; height: 200px;"></div>
        </div>

        <div id="banner-sistem" class="banner-status bg-verde">
            Sistemul se initializeaza...
        </div>

        <div class="hardware-panel">
            <div style="margin-bottom: 10px; color: #c9d1d9;">[ DIAGNOSTIC HARDWARE ]</div>
            Ventilator: <span id="hard-vent">--</span>% <br>
            Servo Geam: <span id="hard-geam">--</span> <br>
            Functie Sistem: <span id="hard-functie">--</span>
        </div>

    </div>

    <script>
        google.charts.load('current', {'packages':['gauge']});
        google.charts.setOnLoadCallback(initCharts);

        let chartTemp, chartPres, chartVib;
        let dataTemp, dataPres, dataVib;
        let optionsTemp, optionsPres, optionsVib;

        function initCharts() {
            dataTemp = google.visualization.arrayToDataTable([['Label', 'Value'], ['Temp (C)', 0]]);
            dataPres = google.visualization.arrayToDataTable([['Label', 'Value'], ['Presiune', 0]]);
            dataVib = google.visualization.arrayToDataTable([['Label', 'Value'], ['Vibratii', 0]]);

            optionsTemp = { min: 0, max: 50, yellowFrom: 28, yellowTo: 35, redFrom: 35, redTo: 50, minorTicks: 5 };
            optionsPres = { min: 900, max: 1100, minorTicks: 10 };
            optionsVib = { min: 0, max: 15, yellowFrom: 3, yellowTo: 6, redFrom: 6, redTo: 15, minorTicks: 1 };

            chartTemp = new google.visualization.Gauge(document.getElementById('gauge_temp'));
            chartPres = new google.visualization.Gauge(document.getElementById('gauge_pres'));
            chartVib = new google.visualization.Gauge(document.getElementById('gauge_vib'));

            chartTemp.draw(dataTemp, optionsTemp);
            chartPres.draw(dataPres, optionsPres);
            chartVib.draw(dataVib, optionsVib);

            setInterval(fetchData, 1500); 
        }

        function fetchData() {
            fetch('/api/stare')
                .then(response => response.json())
                .then(data => {
                    // Update Ceasuri
                    dataTemp.setValue(0, 1, data.t); chartTemp.draw(dataTemp, optionsTemp);
                    dataPres.setValue(0, 1, data.p); chartPres.draw(dataPres, optionsPres);
                    dataVib.setValue(0, 1, data.v);  chartVib.draw(dataVib, optionsVib);

                    // Update Ecrane Exterioare
                    document.getElementById('stare-text').innerText = data.msg;
                    document.getElementById('val-tinta').innerText = data.tinta;

                    // --- UPDATE TERMINAL HARDWARE ---
                    document.getElementById('hard-vent').innerText = data.vnt;
                    document.getElementById('hard-geam').innerText = data.g ? "DESCHIS (90 Grade)" : "INCHIS (180 Grade)";
                    
                    // Calculare "Functie Sistem" bazat pe semnalul LED
                    let functie = "RACIRE";
                    if (data.led === "AMBELE") {
                        functie = "TEMPERATURA AMBIENTALA";
                    } else if (data.led === "ROSU") {
                        functie = "INCALZIRE";
                    }
                    document.getElementById('hard-functie').innerText = functie;

                    // --- LOGICA PENTRU GLOW-UL EXTERIOR AL HALEI ---
                    let hala = document.getElementById('hala-structura');
                    hala.className = ''; // Resetam clasele
                    if (data.t > data.tinta + data.toleranta) {
                        hala.classList.add('glow-albastru'); 
                    } else if (data.t < data.tinta - data.toleranta) {
                        hala.classList.add('glow-rosu'); 
                    } else {
                        hala.classList.add('glow-galben'); 
                    }

                    // --- LOGICA PENTRU BANNER-UL PERMANENT ---
                    let banner = document.getElementById('banner-sistem');
                    banner.className = 'banner-status '; // Resetam culorile bannerului
                    
                    // Prioritizam afisarea in functie de importanta (Kill Switch > Gaz > Vibratii > Optim)
                    if (data.led === "AMBELE") {
                        banner.innerText = "SISTEM OPRIT MANUAL (TEMPERATURA AMBIENTALA)";
                        banner.classList.add('bg-mov');
                    } else if (data.aer) {
                        banner.innerText = "ALERTA GAZ: EVACUARE AER VICIAT!";
                        banner.classList.add('bg-rosu');
                    } else if (data.alert_vib) {
                        banner.innerText = "SCADE TURATIA VENTILATORULUI (Vibratii detectate)";
                        banner.classList.add('bg-galben');
                    } else {
                        banner.innerText = "FUNCTIONEAZA IN PARAMETRII OPTIMI";
                        banner.classList.add('bg-verde');
                    }
                })
                .catch(err => console.error("Asteptare server...", err));
        }
    </script>
</body>
</html>
