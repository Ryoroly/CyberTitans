<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panou Control Digital Twin</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #58a6ff; text-transform: uppercase; letter-spacing: 2px; font-size: 26px; margin-bottom: 20px; }

        /* SWITCH AUTO/MANUAL */
        .mod-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; background: #161b22; padding: 10px 20px; border-radius: 30px; border: 1px solid #30363d; }
        .mod-text { font-weight: bold; font-size: 18px; color: #8b949e; transition: color 0.3s; }
        .mod-active { color: #58a6ff; text-shadow: 0 0 10px rgba(88, 166, 255, 0.5); }
        
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2ea043; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #d29922; } 
        input:checked + .slider:before { transform: translateX(26px); }

        #hala-structura { background-color: #161b22; border-radius: 20px; padding: 40px; width: 90%; max-width: 900px; border: 2px solid #30363d; transition: box-shadow 0.6s ease, border-color 0.6s ease; position: relative; }
        .glow-rosu { box-shadow: 0 0 60px rgba(255, 77, 77, 0.4); border-color: #ff4d4d !important; }
        .glow-albastru { box-shadow: 0 0 60px rgba(77, 166, 255, 0.4); border-color: #4da6ff !important; }
        .glow-galben { box-shadow: 0 0 60px rgba(255, 204, 0, 0.3); border-color: #ffcc00 !important; }

        .ecrane-top { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
        .ecran-digital { background-color: #010409; border: 1px solid #30363d; border-radius: 12px; padding: 20px; flex: 1; text-align: center; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
        .ecran-titlu { font-size: 13px; color: #8b949e; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px;}
        .ecran-valoare { font-size: 24px; font-weight: bold; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 15px;}
        
        /* Butoane ajustare temperatura */
        .btn-ajust { background: #30363d; border: 1px solid #8b949e; color: white; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s;}
        .btn-ajust:hover { background: #58a6ff; border-color: #58a6ff; }

        #panou-manual { display: none; background: #21262d; border: 1px solid #d29922; border-radius: 12px; padding: 20px; margin-bottom: 30px; text-align: center; animation: slideDown 0.5s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .control-grup { margin: 15px 0; }
        .btn-control { background: #30363d; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 0 10px; transition: 0.3s; }
        .btn-control:hover { background: #8b949e; }
        .btn-on { background: #2ea043; }

        /* CEASURI MINIMALISTE DARK MODE */
        .ceasuri-wrapper { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; background-color: #010409; padding: 25px; border-radius: 15px; border: 1px solid #30363d; }
        .ceas-dark svg { filter: invert(0.85) hue-rotate(180deg); }

        .banner-status { margin-top: 25px; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 1px; color: white; transition: background-color 0.4s, border-color 0.4s; }
        .bg-verde { background-color: #2ea043; border-left: 6px solid #238636; }
        .bg-galben { background-color: #9e6a03; border-left: 6px solid #ffd700; animation: pulse 2s infinite; }
        .bg-rosu { background-color: #8a1515; border-left: 6px solid #ff4d4d; }
        .bg-mov { background-color: #551a8b; border-left: 6px solid #9933ff; }
        .bg-manual { background-color: #d29922; border-left: 6px solid #e3b341; color: black;}

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .hardware-panel { margin-top: 30px; background-color: #010409; padding: 20px; border-radius: 12px; border: 1px solid #30363d; font-family: 'Courier New', Courier, monospace; font-size: 15px; color: #8b949e; }
        .hardware-panel span { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Panou Control Digital Twin</h1>

    <div class="mod-container">
        <span id="lbl-auto" class="mod-text mod-active">AUTO</span>
        <label class="switch">
            <input type="checkbox" id="switch-mod" onchange="schimbaMod()">
            <span class="slider"></span>
        </label>
        <span id="lbl-manual" class="mod-text">MANUAL</span>
    </div>

    <div id="hala-structura" class="glow-galben">
        
        <div class="ecrane-top">
            <div class="ecran-digital">
                <div class="ecran-titlu">Temperatura Tinta Setata</div>
                <div class="ecran-valoare">
                    <button class="btn-ajust" onclick="modificaTinta(-0.5)">-</button>
                    <span id="val-tinta">--</span> C
                    <button class="btn-ajust" onclick="modificaTinta(0.5)">+</button>
                </div>
            </div>
            <div class="ecran-digital">
                <div class="ecran-titlu">Status Actiune Curenta</div>
                <div class="ecran-valoare" id="stare-text" style="font-size: 18px;">Conectare...</div>
            </div>
        </div>

        <div id="panou-manual">
            <h3 style="margin-top: 0; color: #d29922; text-transform: uppercase;">Control Manual Echipamente</h3>
            <div class="control-grup">
                <label>Turatie Ventilator: <span id="val-slider">0</span>%</label><br><br>
                <input type="range" id="slider-vent" min="0" max="100" value="0" style="width: 80%;" oninput="updateVent()">
            </div>
            <div class="control-grup">
                <button id="btn-geam" class="btn-control" onclick="toggleGeam()">Geam: INCHIS</button>
                <button id="btn-inc" class="btn-control" onclick="toggleIncalzire()">Incalzire: OPRITA</button>
            </div>
        </div>

        <div class="ceasuri-wrapper ceas-dark">
            <div id="gauge_temp" style="width: 180px; height: 180px;"></div>
            <div id="gauge_pres" style="width: 180px; height: 180px;"></div>
            <div id="gauge_vib" style="width: 180px; height: 180px;"></div>
        </div>

        <div id="banner-sistem" class="banner-status bg-verde">Sistemul se initializeaza...</div>

        <div class="hardware-panel">
            <div style="margin-bottom: 10px; color: #c9d1d9;">[ DIAGNOSTIC HARDWARE ]</div>
            Ventilator: <span id="hard-vent">--</span>% <br>
            Servo Geam: <span id="hard-geam">--</span> <br>
            Functie Sistem: <span id="hard-functie">--</span>
        </div>
    </div>

    <script>
        google.charts.load('current', {'packages':['gauge']});
        google.charts.setOnLoadCallback(initCharts);

        let chartTemp, chartPres, chartVib;
        let dataTemp, dataPres, dataVib;
        let optionsTemp, optionsPres, optionsVib;

        let manualGeam = false;
        let manualInc = false;
        let localTinta = 26.0;

        function initCharts() {
            dataTemp = google.visualization.arrayToDataTable([['Label', 'Value'], ['Temp C', 0]]);
            dataPres = google.visualization.arrayToDataTable([['Label', 'Value'], ['Presiune', 0]]);
            dataVib = google.visualization.arrayToDataTable([['Label', 'Value'], ['Vibratii', 0]]);

            // Ticks scosi pentru un look minimalist curat
            optionsTemp = { min: 0, max: 50, yellowFrom: 28, yellowTo: 35, redFrom: 35, redTo: 50, minorTicks: 0, majorTicks: ['0', '', '', '', '', '50'] };
            optionsPres = { min: 900, max: 1100, minorTicks: 0, majorTicks: ['900', '', '', '', '1100'] };
            optionsVib = { min: 0, max: 15, yellowFrom: 3, yellowTo: 6, redFrom: 6, redTo: 15, minorTicks: 0, majorTicks: ['0', '', '', '15'] };

            chartTemp = new google.visualization.Gauge(document.getElementById('gauge_temp'));
            chartPres = new google.visualization.Gauge(document.getElementById('gauge_pres'));
            chartVib = new google.visualization.Gauge(document.getElementById('gauge_vib'));

            chartTemp.draw(dataTemp, optionsTemp);
            chartPres.draw(dataPres, optionsPres);
            chartVib.draw(dataVib, optionsVib);

            setInterval(fetchData, 1500); 
        }

        function trimiteComanda(date) {
            fetch('/api/comanda', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(date) });
        }

        function modificaTinta(delta) {
            localTinta += delta;
            document.getElementById('val-tinta').innerText = localTinta.toFixed(1);
            trimiteComanda({ tinta: localTinta });
        }

        function schimbaMod() {
            const isManual = document.getElementById('switch-mod').checked;
            document.getElementById('lbl-auto').className = isManual ? "mod-text" : "mod-text mod-active";
            document.getElementById('lbl-manual').className = isManual ? "mod-text mod-active" : "mod-text";
            document.getElementById('panou-manual').style.display = isManual ? "block" : "none";
            trimiteComanda({ mod: isManual ? "MANUAL" : "AUTO" });
        }

        function updateVent() {
            let val = document.getElementById('slider-vent').value;
            document.getElementById('val-slider').innerText = val;
            trimiteComanda({ vent: val });
        }

        function toggleGeam() {
            manualGeam = !manualGeam;
            let btn = document.getElementById('btn-geam');
            btn.innerText = manualGeam ? "Geam: DESCHIS" : "Geam: INCHIS";
            btn.className = manualGeam ? "btn-control btn-on" : "btn-control";
            trimiteComanda({ geam: manualGeam });
        }

        function toggleIncalzire() {
            manualInc = !manualInc;
            let btn = document.getElementById('btn-inc');
            btn.innerText = manualInc ? "Incalzire: PORNITA" : "Incalzire: OPRITA";
            btn.className = manualInc ? "btn-control btn-on" : "btn-control";
            trimiteComanda({ inc: manualInc });
        }

        function fetchData() {
            fetch('/api/stare')
                .then(response => response.json())
                .then(data => {
                    dataTemp.setValue(0, 1, data.t); chartTemp.draw(dataTemp, optionsTemp);
                    dataPres.setValue(0, 1, data.p); chartPres.draw(dataPres, optionsPres);
                    dataVib.setValue(0, 1, data.v);  chartVib.draw(dataVib, optionsVib);

                    document.getElementById('stare-text').innerText = data.msg;
               
                    // Sincronizare tinta locala cu serverul pentru a nu se desincroniza
                    localTinta = data.tinta;
                    document.getElementById('val-tinta').innerText = localTinta.toFixed(1);

                    document.getElementById('hard-vent').innerText = data.vnt;
                    document.getElementById('hard-geam').innerText = data.g ? "DESCHIS (90 Grade)" : "INCHIS (180 Grade)";
                    
                    let functie = "RACIRE";
                    if (data.led === "AMBELE") functie = "TEMPERATURA AMBIENTALA";
                    else if (data.led === "ROSU") functie = "INCALZIRE";
                    document.getElementById('hard-functie').innerText = functie;

                    let hala = document.getElementById('hala-structura');
                    hala.className = ''; 
                    if (!data.auto) hala.classList.add('glow-galben'); 
                    else if (data.t > data.tinta + data.toleranta) hala.classList.add('glow-albastru'); 
                    else if (data.t < data.tinta - data.toleranta) hala.classList.add('glow-rosu'); 
                    else hala.classList.add('glow-galben'); 

                    let banner = document.getElementById('banner-sistem');
                    banner.className = 'banner-status '; 
                    
                    if (data.led === "AMBELE") {
                        banner.innerText = "SISTEM OPRIT MANUAL (BUTON FIZIC)";
                        banner.classList.add('bg-mov');
                    } else if (!data.auto) {
                        banner.innerText = "OVERRIDE MANUAL ACTIVAT";
                        banner.classList.add('bg-manual');
                    } else if (data.aer) {
                        banner.innerText = "ALERTA GAZ: EVACUARE AER VICIAT!";
                        banner.classList.add('bg-rosu');
                    } else if (data.alert_vib) {
                        banner.innerText = "SCADE TURATIA VENTILATORULUI (Vibratii detectate)";
                        banner.classList.add('bg-galben');
                    } else {
                        banner.innerText = "FUNCTIONEAZA IN PARAMETRII OPTIMI (AUTO)";
                        banner.classList.add('bg-verde');
                    }
                })
                .catch(err => console.error("Asteptare server...", err));
        }
    </script>
</body>
</html>
